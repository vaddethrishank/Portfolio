<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              'vt323': ['"VT323"', 'monospace'],
              'fira-code': ['"Fira Code"', 'monospace'],
            },
            colors: {
              'term-black': '#050505',
              'term-green': '#39ff14',
              'term-green-dim': '#1a8f08',
              'term-gray': '#a3a3a3',
              'term-red': '#ff3333',
              'term-window': '#1a1a1a',
              'term-titlebar': '#2d2d2d',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'blink': 'blink 1s step-end infinite',
              'scanline': 'scanline 8s linear infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              blink: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' },
              },
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100vh)' },
              }
            },
            boxShadow: {
              'glow': '0 0 10px rgba(57, 255, 20, 0.7), 0 0 20px rgba(57, 255, 20, 0.5)',
              'glow-sm': '0 0 5px rgba(57, 255, 20, 0.5)',
            }
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'VT323', monospace;
        background-color: #000000;
        color: #39ff14;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Hide main body scrollbar, we will scroll inside the window */
      }
      /* VS Code like scrollbar */
      ::-webkit-scrollbar {
        width: 14px;
      }
      ::-webkit-scrollbar-track {
        background: #1e1e1e;
      }
      ::-webkit-scrollbar-thumb {
        background: #424242;
        border: 3px solid #1e1e1e;
        border-radius: 7px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4f4f4f;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-vscode-bg text-vscode-fg">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
